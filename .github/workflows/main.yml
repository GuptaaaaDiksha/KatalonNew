name: katalon-test

on:
  push:
    branches:
      - Develop
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq unzip curl jq xvfb

      - name: Set Chrome version to 138.0.7204.183 (CfT)
        run: echo "chrome_version=138.0.7204.183" >> $GITHUB_ENV

      - name: Download matching ChromeDriver & Chrome for Testing
        run: |
          set -e
          echo "Using Chrome version: $chrome_version"

          # Download ChromeDriver
          curl -s -o chromedriver.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$chrome_version/linux64/chromedriver-linux64.zip"
          unzip chromedriver.zip
          chmod +x chromedriver
          sudo mv chromedriver /usr/local/bin/chromedriver

          # Download Chrome itself
          curl -s -o chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$chrome_version/linux64/chrome-linux64.zip"
          unzip chrome.zip
          sudo mv chrome-linux64 /opt/google/chrome
          sudo ln -sf /opt/google/chrome/chrome /usr/bin/google-chrome

      - name: Verify installed versions
        run: |
          echo "Chrome binary version:"
          /opt/google/chrome/chrome --version
          echo "Chromedriver version:"
          chromedriver --version

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo "DISPLAY is set to :99"

      - name: Download and extract Katalon Studio Engine
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          curl -L -O "https://download.katalon.com/9.2.0/Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz"
          tar -xzf Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz
          chmod +x Katalon_Studio_Engine_Linux_64-9.2.0/katalonc

      - name: Run Katalon tests
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
          DISPLAY: :99
          CHROME_BIN: /opt/google/chrome/chrome  # Force use of CfT Chrome
        run: |
          ./Katalon_Studio_Engine_Linux_64-9.2.0/katalonc \
            -noSplash \
            -runMode=console \
            -projectPath="$(pwd)/DemoTestsStudioAssist.prj" \
            -retry=0 \
            -testSuitePath="Test Suites/selfHealingSuite" \
            -executionProfile="default" \
            -browserType="Chrome (headless)" \
            -apiKey="${KATALON_API_KEY}"
