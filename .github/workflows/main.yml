name: katalon-test

on:
  push:
    branches:
      - Develop
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq unzip curl jq xvfb

      - name: Get latest stable Chrome-for-Testing version
        id: get_chrome_version
        run: |
          set -e
          LATEST_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json | jq -r '.channels.Stable.version')
          echo "Latest stable Chrome version: $LATEST_VERSION"
          echo "chrome_version=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Download ChromeDriver and Chrome for Testing
        run: |
          set -e
          echo "Using Chrome version: $chrome_version"

          echo "Downloading ChromeDriver..."
          curl -s -o chromedriver-linux64.zip "https://storage.googleapis.com/chrome-for-testing-public/$chrome_version/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          chmod +x chromedriver-linux64/chromedriver
          sudo mv chromedriver-linux64/chromedr
