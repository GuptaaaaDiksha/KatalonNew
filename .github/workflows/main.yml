name: Katalon UI Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq unzip curl jq xvfb

      - name: Download Chrome for Testing and ChromeDriver
        run: |
          # Get latest stable chrome-for-testing version info JSON
          curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json > versions.json

          # Parse the latest stable version
          STABLE_VERSION=$(jq -r '.channels.Stable.version' versions.json)

          echo "Latest stable chrome-for-testing version: $STABLE_VERSION"

          # Download Chrome for Testing (Linux)
          curl -LO $(jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform=="linux64") | .url' versions.json)

          # Download ChromeDriver (Linux)
          curl -LO $(jq -r '.channels.Stable.downloads.chrome[] | select(.platform=="linux64") | .url' versions.json)

          # Unpack ChromeDriver
          unzip chromedriver-linux64.zip
          chmod +x chromedriver-linux64/chromedriver
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver

          # Unpack Chrome for Testing
          tar -xzf linux64/chrome-linux64.tar.gz
          sudo mv chrome-linux64 /opt/google/chrome

          # Set chrome binary path for Katalon to use this Chrome version
          echo "/opt/google/chrome/chrome" > chrome-path.txt

      - name: Download Katalon Studio Engine
        run: |
          curl -LO https://github.com/katalon-studio/katalon-studio/releases/download/v9.2.0/Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz
          tar -xzf Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo "DISPLAY is $DISPLAY"

      - name: Run Katalon tests
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
          DISPLAY: :99
          KATALON_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          ./Katalon_Studio_Engine_Linux_64-9.2.0/katalonc \
            -noSplash \
            -runMode=console \
            -projectPath=$(pwd)/DemoTestsStudioAssist.prj \
            -retry=0 \
            -testSuitePath="Test Suites/selfHealingSuite" \
            -executionProfile="default" \
            -browserType="Chrome (headless)" \
            -apiKey="${KATALON_API_KEY}" \
            -browserExecutablePath=$(cat chrome-path.txt)
