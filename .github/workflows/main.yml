name: Katalon UI Test Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yqq unzip curl jq xvfb

    - name: Download Katalon Studio Engine
      run: |
        curl -LO https://github.com/katalon-studio/katalon-studio/releases/download/v9.2.0/Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz
        tar -xzf Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz

    - name: Get latest stable Chrome-for-Testing version
      id: get_chrome_version
      run: |
        LATEST_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json | jq -r '.channels.stable.version')
        echo "chrome_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

    - name: Download ChromeDriver and Chrome-for-Testing
      run: |
        VERSION=${{ steps.get_chrome_version.outputs.chrome_version }}
        echo "Downloading ChromeDriver version $VERSION"
        curl -sSL -o chromedriver-linux64.zip "https://storage.googleapis.com/chrome-for-testing-public/$VERSION/linux64/chromedriver-linux64.zip"
        unzip -o chromedriver-linux64.zip -d chromedriver-linux64
        chmod +x chromedriver-linux64/chromedriver
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver

        echo "Downloading Chrome-for-Testing $VERSION"
        curl -sSL -o chrome-linux64.zip "https://storage.googleapis.com/chrome-for-testing-public/$VERSION/linux64/chrome-linux64.zip"
        unzip -o chrome-linux64.zip -d chrome-linux64

    - name: Set Chrome binary path
      run: |
        echo "CHROME_BIN=$(pwd)/chrome-linux64/chrome" >> $GITHUB_ENV

    - name: Start virtual display (Xvfb)
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 3
        echo "DISPLAY is :99" >> $GITHUB_ENV

    - name: Run Katalon tests with UI enabled
      env:
        KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        DISPLAY: :99
        CHROME_BIN: ${{ env.CHROME_BIN }}
      run: |
        ./Katalon_Studio_Engine_Linux_64-9.2.0/katalonc \
          -noSplash \
          -runMode=console \
          -projectPath=$(pwd)/DemoTestsStudioAssist.prj \
          -retry=0 \
          -testSuitePath="Test Suites/selfHealingSuite" \
          -executionProfile="default" \
          -browserType="Chrome" \
          -apiKey="${KATALON_API_KEY}"
