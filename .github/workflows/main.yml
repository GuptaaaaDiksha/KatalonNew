name: Run Katalon Tests

on:
  push:
    branches:
      - Develop
  pull_request:
    branches:
      - Develop

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/11.0.28-6/x64
      DISPLAY: :99

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Verify project file exists
      run: ls -lah "$(pwd)/DemoTestsStudioAssist.prj" || echo "Project file NOT found!"

    - name: Start virtual display
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 3
        echo "DISPLAY is $DISPLAY"

    - name: Run Katalon tests
      env:
        KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
      run: |
        ./Katalon_Studio_Engine_Linux_64-9.2.0/katalonc \
          -noSplash \
          -runMode=console \
          -projectPath=$(pwd)/DemoTestsStudioAssist.prj \
          -retry=0 \
          -testSuitePath="Test Suites/SelfHealingSuite" \
          -executionProfile="default" \
          -browserType="Chrome (headless)" \
          -apiKey="${KATALON_API_KEY}"

    - name: Cleanup
      run: |
        echo "Cleanup tasks if any"
