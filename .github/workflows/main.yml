name: Katalon Test with UI (headless Chrome)

on:
  push:
    branches:
      - Develop
  workflow_dispatch:

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yqq unzip curl jq xvfb

    - name: Download Katalon Studio Engine
      run: |
        curl -LO https://github.com/katalon-studio/katalon-studio/releases/download/v9.2.0/Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz
        tar -xzf Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz

    - name: Download Chrome for Testing and ChromeDriver
      run: |
        # Fetch Chrome-for-Testing versions JSON
        curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json > versions.json

        STABLE_VERSION=$(jq -r '.channels.Stable.version' versions.json)
        echo "Latest stable chrome-for-testing version: $STABLE_VERSION"

        # Download ChromeDriver for linux64
        CHROMEDRIVER_URL=$(jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform=="linux64") | .url' versions.json)
        echo "Downloading ChromeDriver from $CHROMEDRIVER_URL"
        curl -LO "$CHROMEDRIVER_URL"

        unzip chromedriver-linux64.zip
        chmod +x chromedriver-linux64/chromedriver
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver

        # Download Chrome for Testing for linux64
        CHROME_URL=$(jq -r '.channels.Stable.downloads.chrome[] | select(.platform=="linux64") | .url' versions.json)
        echo "Downloading Chrome from $CHROME_URL"
        curl -LO "$CHROME_URL"

        CHROME_ARCHIVE=${CHROME_URL##*/}
        ec
