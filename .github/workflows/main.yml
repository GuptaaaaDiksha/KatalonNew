name: Run Katalon Tests

on:
  push:
    branches:
      - Develop
  pull_request:
    branches:
      - Develop
  workflow_dispatch:  #


jobs:
  katalon-test:
    runs-on: ubuntu-latest

    env:
      DISPLAY: :99
      KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Katalon Studio Engine
        run: |
          wget https://download.katalon.com/9.2.0/Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz
          tar -xzf Katalon_Studio_Engine_Linux_64-9.2.0.tar.gz

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3

      - name: Verify project file exists
        run: ls -lah "$(pwd)/DemoTestsStudioAssist.prj"

      - name: Run Katalon tests
        run: |
          ./Katalon_Studio_Engine_Linux_64-9.2.0/katalonc \
            -noSplash \
            -runMode=console \
            -projectPath="$(pwd)/DemoTestsStudioAssist.prj" \
            -retry=0 \
            -testSuitePath="Test Suites/SelfHealingSuite" \
            -executionProfile="default" \
            -browserType="Chrome (headless)" \
            -apiKey="${KATALON_API_KEY}"

      - name: Show logs if failed
        if: failure()
        run: cat ./Katalon_Studio_Engine_Linux_64-9.2.0/configuration/*.log
