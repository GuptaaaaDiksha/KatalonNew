name: Katalon Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  katalon-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yqq unzip curl jq xvfb

    - name: Install ChromeDriver
      run: |
        # Use fixed driver version compatible with stable Chrome (change if needed)
        DRIVER_VERSION="114.0.5735.90"

        echo "Downloading ChromeDriver version: $DRIVER_VERSION"
        curl -LO https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip

        if [ ! -f chromedriver_linux64.zip ]; then
          echo "Failed to download ChromeDriver zip!"
          exit 1
        fi

        unzip chromedriver_linux64.zip
        chmod +x chromedriver
        sudo mv chromedriver /usr/local/bin/chromedriver

    - name: Start virtual display
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 3
        echo "DISPLAY is $DISPLAY"

    - name: Run Katalon tests
      env:
        KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        DISPLAY: :99
      run: |
        ./Katalon_Studio_Engine_Linux_64-9.2.0/katalonc \
          -noSplash \
          -runMode=console \
          -projectPath=$(pwd)/DemoTestsStudioAssist.prj \
          -retry=0 \
          -testSuitePath="Test Suites/selfHealingSuite" \
          -executionProfile="default" \
          -browserType="Chrome (headless)" \
          -apiKey="${KATALON_API_KEY}"

